name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder so Prisma Client generation and SvelteKit build can run.
      # No database connection is made during CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/melles?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        # VERCEL=1 exercises the real serverless adapter, which requires symlink
        # support that is available on Linux runners but not on Windows/OneDrive.
        env:
          VERCEL: '1'
        run: pnpm build
